{{ define "main" }}
<section class="container mx-auto px-4 py-12 md:py-20">
    <div class="max-w-4xl mx-auto text-center">
        <h1 class="text-6xl md:text-8xl font-bold text-loki-ink-900 dark:text-loki-teal-100 dark:glow-teal mb-4">
            404
        </h1>
        <h2 class="text-2xl md:text-4xl font-semibold text-loki-ink-700 dark:text-loki-sun-200 mb-6">
            Page Not Found
        </h2>
        <p class="text-lg text-loki-ink-600 dark:text-loki-ink-300 mb-8">
            Sorry, the page you're looking for doesn't exist or has been moved.
        </p>
        <div class="my-4 p-4 border-loki-sun-700 dark:border-loki-sun-300 rounded-2xl border-2 text-left bg-loki-sun-100 dark:bg-loki-sun-200/10 text-loki-sun-800 dark:text-loki-sun-200">
            <p><strong>Heads up!</strong> We are under construction, this link might be updated with new features. Stay tuned!</p>
        </div>
        <a href="{{ .Site.BaseURL }}" class="inline-block px-6 py-3 bg-logo-sun hover:bg-loki-sun-200 text-loki-ink-900 font-semibold rounded-lg transition duration-200 no-underline">

            Go Back Home
        </a>
    </div>
</section>
{{ end }}
