{{ define "main" }}
<div class="container mx-auto px-4 py-8 max-w-4xl">
    <section class="prose dark:prose-invert prose-a:text-loki-teal-700 prose-a:hover:text-loki-teal-900 dark:prose-headings:text-loki-teal-200 dark:prose-headings:glow-teal dark:prose-a:text-loki-teal-300 dark:prose-a:hover:text-loki-teal-100 dark:prose-code:text-loki-plum-300 dark:prose-code:bg-loki-plum-900/20 dark:prose-pre:bg-loki-ink-950/60 dark:prose-pre:border dark:prose-pre:border-loki-teal-400/20 dark:prose-strong:text-loki-teal-100 dark:prose-em:text-loki-sky-300 dark:prose-hr:border-loki-teal-400/30">
        <h1>{{ .Title }}</h1>
        {{ .Content }}
        
        {{ range .Pages }}
        <article class="my-8">
            <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
            {{ if .Date }}
            <time class="text-sm opacity-75">{{ .Date.Format "January 2, 2006" }}</time>
            {{ end }}
            {{ if .Summary }}
            <p>{{ .Summary }}</p>
            {{ end }}
        </article>
        {{ end }}
    </section>
</div>
{{ end }}
