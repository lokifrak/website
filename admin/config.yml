backend:
  name: github
  repo: lokifrak/website     # Your GitHub username or group and repo name

# Media configuration
media_folder: "uploads"
public_folder: "/uploads"

# Locale configuration
locale: en

# Collections
collections:
  # Pages Collection
  - name: pages
    label: Pages
    folder: content
    format: frontmatter
    create: true
    slug: '{{slug}}'
    fields:
      - {label: Title, name: title, widget: string, required: true}
      - {label: Draft, name: draft, widget: boolean, default: false}
      - {label: Date, name: date, widget: datetime, default: now, format: 'YYYY-MM-DDTHH:mm:ssZ'}
      - {label: Body, name: body, widget: markdown}

  # Blog Posts Collection
  - name: posts
    label: Blog Posts
    folder: content/posts
    format: frontmatter
    create: true
    slug: '{{year}}{{month}}{{day}}-{{slug}}'
    fields:
      - {label: Title, name: title, widget: string, required: true}
      - {label: Date, name: date, widget: datetime, required: true, default: now, format: 'YYYY-MM-DDTHH:mm:ssZ'}
      - {label: Draft, name: draft, widget: boolean, default: false}
      - {label: Author, name: author, widget: string}
      - {label: Tags, name: tags, widget: list, default: []}
      - {label: Categories, name: categories, widget: list, default: ['Blog']}
      - {label: Body, name: body, widget: markdown}

  # Publications Collection
  - name: publications
    label: Publications
    folder: content/publications
    format: frontmatter
    create: true
    slug: '{{slug}}'
    fields:
      - label: Title
        name: title
        widget: string
        required: true
      - label: Release Date
        name: date
        widget: datetime
        required: true
        default: now
        format: 'DD MMMM YYYY'
        time_format: false
      - {label: Draft, name: draft, widget: boolean, default: false}
      - label: Series
        name: series
        widget: list
        required: false
        default: []
        summary: '{{fields.item}}'
      - label: Author
        name: authors
        widget: list
        required: false
        default: []
        summary: '{{fields.item}}'
      - label: Illustrator
        name: illustrators
        widget: list
        required: false
        default: []
        summary: '{{fields.item}}'
      - label: Editor
        name: editors
        widget: list
        required: true
        default: ['Gibran Alfaro']
        summary: '{{fields.item}}'
      - label: Description
        name: description
        widget: text
        required: false
      - label: Image
        name: image
        widget: image
        required: false
      - label: Genres
        name: genres
        widget: list
        default: ['Comedy']
        summary: '{{fields.item}}'
      - {label: Print ISBN, name: print_isbn, widget: string, required: false, default: 'N/A'}
      - {label: eBook ISBN, name: ebook_isbn, widget: string, required: false, default: 'N/A'}
      - label: Publisher
        name: publisher
        widget: string
        required: true
        default: 'PT Lokakarya Kreativitas Indonesia FRAK'
      - label: City of Publication
        name: pub_city
        widget: string
        required: true
        default: 'Jakarta'
      - label: Year of First Publication
        name: pub_year
        widget: datetime
        required: true
        default: now
        format: 'YYYY'
        time_format: false
      - label: No. of Pages
        name: pages
        widget: number
        required: true
        value_type: int
        default: 20
      - label: Language
        name: language
        widget: select
        required: true
        options: ['English', 'Indonesian']
        default: 'English'
      - label: Format
        name: formats
        widget: select
        required: true
        multiple: true
        options: ['Print', 'PDF eBook', 'EPUB eBook']
        default: ['Print', 'PDF eBook', 'EPUB eBook']
      - label: Java Island Print MRP (HET)
        name: print_mrp_java
        widget: string
        required: true
        default: 'Rp100,000'
      - label: eBook MRP
        name: ebook_mrp
        widget: string
        required: true
        default: 'Rp55,000'
      - label: Physical Description
        name: physical
        widget: object
        required: true
        fields:
          - label: Bind
            name: bind
            widget: select
            required: true
            options: ['perfect bound', 'stapled']
            default: 'perfect bound'
          - label: Paper Type
            name: paper
            widget: string
            required: true
            default: 'B5 100gsm paper'
          - label: Print
            name: print
            widget: select
            required: true
            options: ['color', 'bw']
            default: 'color'
      - label: Links
        name: links
        widget: list
        required: false
        summary: '{{fields.ref}} → {{fields.link}}'
        fields:
          - {label: Label, name: ref, widget: string, required: true}
          - {label: URL, name: link, widget: string, required: true}
      - {label: Body, name: body, widget: markdown}

  # Hero Data Collection (YAML)
  - name: hero
    label: Hero Section
    files:
      - name: hero
        label: Hero Data
        file: data/hero.yaml
        format: yaml
        fields:
          - label: Hero Items
            name: items
            widget: list
            fields:
              - {label: Title, name: title, widget: string, required: true}
              - {label: Subtitle, name: subtitle, widget: string}
              - {label: Image, name: image, widget: image, required: false}
              - {label: Link, name: link, widget: string}